# What `cargo deny check` holds the dependencies to: licences that sit with
# GPL-3.0-or-later, crates.io and the Trindle toolkit as the only sources, and
# no known vulnerability.

[graph]
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
unmaintained = "all"
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser draws a font's sample page in the viewer; it forbids unsafe code, so a damaged font can only fail or stop the program, and the font is size-limited first; skrifa, already used here for names, is the way out" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant only encodes messages on the person's own session and system buses (drives, the keyring, the file chooser); it moved into zbus 6, which Folders and the toolkit must move to together" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names only holds bus names for those same buses; it moved into zbus 6, which Folders and the toolkit must move to together" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is zvariant's build-time macro and is not in the running program" },
]

[licenses]
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "bzip2-1.0.6",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/trindle-os/trindle-toolkit"]
